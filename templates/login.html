{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>{{ 'Admin portal' if admin_page else 'Let’s get you going.' }}</h1><p>Sign in to manage your journeys.</p><form method="post"><label>Email</label><input class="form-control mb-3" name="email" type="email" required autocomplete="email"><label>Password</label><input class="form-control mb-4" name="password" type="password" required autocomplete="current-password"><button class="btn btn-accent w-100">Sign in</button></form>{% if not admin_page %}<p class="mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>{% endif %}</div></div>{% endblock %}
