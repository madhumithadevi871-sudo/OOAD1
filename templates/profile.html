{% extends 'base.html' %}{% block title %}Your profile{% endblock %}{% block content %}<div class="container py-5 narrow"><span class="eyebrow">ACCOUNT</span><h1>Your profile</h1><form method="post" class="quote-card"><label>Full name</label><input class="form-control mb-3" name="full_name" required value="{{ user.full_name }}"><label>Email</label><input class="form-control mb-3" value="{{ user.email }}" disabled><label>Phone</label><input class="form-control mb-4" name="phone" required value="{{ user.phone }}"><button class="btn btn-accent">Save changes</button></form></div>{% endblock %}
