<section class="mt-5"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="mb-0">Recent customers</h2><a href="{{ url_for('admin_customers') }}">View all customers →</a></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th><th>Status</th></tr></thead><tbody>{% for c in customers %}<tr><td>{{ c.full_name }}</td><td>{{ c.email }}</td><td>{{ c.phone }}</td><td>{{ c.created_at }}</td><td>{{ 'Active' if c.is_active else 'Inactive' }}</td></tr>{% else %}<tr><td colspan="5" class="text-muted">No customers registered yet.</td></tr>{% endfor %}</tbody></table></div></section>
